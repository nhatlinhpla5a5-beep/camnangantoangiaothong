<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Khu vui chơi online</title>
  <style>
    body { font-family: Arial; background: #f9f9f9; text-align: center; }
    h1 { color: #007bff; }
    .game-box { margin: 20px auto; width: 80%; max-width: 800px; }
    iframe { width: 100%; height: 500px; border: none; }
    .link { margin: 10px; display: inline-block; padding: 10px 15px; background: #007bff; color: white; text-decoration: none; border-radius: 6px; }
    .link:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h1>🎮 Khu vui chơi trực tuyến 🎮</h1>
  <p>Chọn một trò chơi bên dưới để bắt đầu nhé!</p>

  <div>
    <a class="link" href="#game1">Wordwall</a>
    <a class="link" href="#game2">Scratch</a>
    <a class="link" href="#game3">HTML Game</a>
  </div>

  <div id="game1" class="game-box">
    <h2>🧩 Trò chơi Wordwall</h2>
    <iframe src="https://wordwall.net/embed/your-game-link"></iframe>
  </div>

  <div id="game2" class="game-box">
    <h2>🐱 Game Scratch</h2>
    <iframe src="https://scratch.mit.edu/projects/your-project-id/embed"></iframe>
  </div>

  <div id="game3" class="game-box">
    <h2>🎯 Game HTML (tự tạo)</h2>
    <iframe src="game1/index.html"></iframe>
  </div>
</body>
</html>
